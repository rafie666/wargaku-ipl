name: Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'landing-page/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json

      - name: Install & Build Landing Page
        run: |
          cd landing-page
          npm ci
          npm run build

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '103.134.221.200' }}
          username: ${{ secrets.SERVER_USER || 'adminapp' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: 'landing-page/dist/*'
          target: '/home/adminapp/landing-page/dist'
          strip_components: 2
          overwrite: true

      - name: Reload Web Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '103.134.221.200' }}
          username: ${{ secrets.SERVER_USER || 'adminapp' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "${{ secrets.SERVER_PASSWORD }}" | sudo -S docker restart expo-web-portal || sudo docker restart expo-web-portal || true
