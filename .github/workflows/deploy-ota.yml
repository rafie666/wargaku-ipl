name: Auto Deploy OTA Update (Wargaku Mobile)

on:
  push:
    branches:
      - main
    paths:
      - 'ipl-mobile/**'
      - '.github/workflows/deploy-ota.yml'
  workflow_dispatch:

jobs:
  deploy-ota:
    name: Build & Publish OTA Update
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ipl-mobile/package-lock.json

      - name: 📦 Install Dependencies
        run: |
          cd ipl-mobile
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🚀 Export Expo Android Bundle
        env:
          EXPO_PUBLIC_API_URL: https://api-warga.glosindo.net.id
          EXPO_PUBLIC_SUPABASE_URL: https://api-warga.glosindo.net.id
        run: |
          cd ipl-mobile
          npx expo export --platform android

      - name: 📡 Upload OTA Bundle to Server 2 via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_API_HOST || '103.134.221.201' }}
          username: ${{ secrets.SERVER_API_USER || 'adminapi' }}
          password: ${{ secrets.SERVER_API_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_API_PORT || 22 }}
          source: 'ipl-mobile/dist/*'
          target: '/home/adminapi/wargaku-api/updates/incoming'
          strip_components: 2
          overwrite: true

      - name: 🔄 Activate Update & Verify Manifest
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_API_HOST || '103.134.221.201' }}
          username: ${{ secrets.SERVER_API_USER || 'adminapi' }}
          password: ${{ secrets.SERVER_API_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_API_PORT || 22 }}
          script: |
            rm -rf /home/adminapi/wargaku-api/updates/current
            mv /home/adminapi/wargaku-api/updates/incoming /home/adminapi/wargaku-api/updates/current
            echo "Checking manifest status:"
            curl -s -H "expo-platform: android" -H "expo-runtime-version: 2.0.0" -H "expo-protocol-version: 1" https://api-warga.glosindo.net.id/api/manifest | grep -q "launchAsset" && echo "✅ OTA Update Live on api-warga.glosindo.net.id" || echo "⚠️ Manifest verification failed"
