server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    port_in_redirect off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # APK direct downloads
    location = /wargaku-ipl.apk {
        alias /usr/share/nginx/downloads/wargaku.apk;
        add_header Content-Disposition "attachment; filename=wargaku-ipl.apk";
        default_type application/vnd.android.package-archive;
    }

    location = /wargaku-ipl-v2.0.0.apk {
        alias /usr/share/nginx/downloads/wargaku.apk;
        add_header Content-Disposition "attachment; filename=wargaku-ipl-v2.0.0.apk";
        default_type application/vnd.android.package-archive;
    }

    location = /ipl-warga.apk {
        alias /usr/share/nginx/downloads/wargaku.apk;
        add_header Content-Disposition "attachment; filename=wargaku-ipl.apk";
        default_type application/vnd.android.package-archive;
    }

    location /download/ {
        alias /usr/share/nginx/downloads/;
        autoindex on;
        add_header Content-Disposition "attachment";
        default_type application/vnd.android.package-archive;
    }

    # Expo Web App Routing
    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        alias /usr/share/nginx/expo/;
        index index.html;
    }

    location ^~ /_expo/ {
        alias /usr/share/nginx/expo/_expo/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static Assets Caching (Landing Page)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|webp|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Landing Page SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
